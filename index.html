<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>待办清单</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">

        <header class="app-head">
            <h1>待办清单</h1>
            <button id="theme-btn" type="button" class="theme-btn">🌙 深色</button>
        </header>

        <!-- 用 form 包起来：这样按回车也能提交，不用只靠点按钮 -->
        <form class="add-form">
            <input id="todo-input" type="text" placeholder="要做什么？" autocomplete="off">
            <button type="submit">添加</button>
        </form>
        <!-- 三个筛选按钮：data-filter 记着它是哪一档 -->
        <div class="filters">
            <button type="button" class="filter-btn active" data-filter="all">全部</button>
            <button type="button" class="filter-btn" data-filter="active">未完成</button>
            <button type="button" class="filter-btn" data-filter="done">已完成</button>
        </div>

        <!-- 剩余计数：JS 每次重画时更新中间那个数字 -->
        <p class="count">剩余 <span id="count">0</span> 项未完成</p>

        <!-- 空的 ul，JS 会把新条目塞进来 -->
        <ul id="todo-list" class="todo-list"></ul>

        <!-- 一条都还没有时显示这段提示 -->
        <p id="empty" class="empty">还没有待办，加一条试试</p>

        <!-- 底部工具栏：把数据带走 / 拿回来 -->
        <footer class="tools">
            <button id="export-btn" type="button" class="tool-btn">导出 JSON</button>
            <button id="import-btn" type="button" class="tool-btn">导入 JSON</button>
            <!-- 藏起来的文件选择框：用户看不见，点"导入"时由 JS 替他去点 -->
            <input id="import-file" type="file" accept=".json,application/json" hidden>
        </footer>

    </main>

    <!-- 脚本放最后：保证上面所有元素都已经存在，JS 才去抓 -->
    <script src="app.js"></script>

</body>
</html>
